<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok AI 客服工作台</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1180px,calc(100% - 28px));margin:28px auto} h1{margin:0;font-size:26px}.sub{margin:6px 0 22px;color:#667085}
    .layout{display:grid;grid-template-columns:380px 1fr;gap:18px}.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 7px 25px rgba(16,24,40,.06)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-head h2{font-size:18px;margin:0}
    button{border:0;border-radius:9px;padding:10px 15px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
    .secondary{background:#eef2f6;color:#17202a}.primary{background:#111827;color:#fff}.danger{background:#b42318;color:#fff}
    #list{display:grid;gap:10px;max-height:680px;overflow:auto}.empty{padding:26px 12px;text-align:center;color:#667085;background:#f8fafc;border-radius:10px}
    .chat{width:100%;text-align:left;background:#f8fafc;border:1px solid #e4e7ec;padding:13px}.chat:hover{border-color:#84caff;background:#f5fbff}.chat.active{border-color:#0ba5ec;background:#effbff}
    .chat-top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.badge{background:#d92d20;color:#fff;border-radius:999px;min-width:24px;padding:2px 8px;text-align:center;font-size:12px}.preview{display:block;margin-top:6px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    label{display:block;font-weight:650;margin:16px 0 7px}input,textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px;font:inherit}textarea{min-height:115px;resize:vertical;line-height:1.55}#message{min-height:190px}
    input:focus,textarea:focus{outline:2px solid #b9e6fe;border-color:#0ba5ec}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    #status{min-height:24px;margin:16px 0 0;padding:11px;border-radius:9px;background:#f8fafc;color:#475467}.success{background:#ecfdf3!important;color:#027a48!important}.error{background:#fef3f2!important;color:#b42318!important}
    @media(max-width:820px){.layout{grid-template-columns:1fr}#list{max-height:360px}}
  </style>
</head>
<body>
<main>
  <h1>TikTok AI 客服工作台</h1>
  <p class="sub">选择未读会话，生成 AI 草稿，检查修改后再人工发送。</p>
  <div class="layout">
    <section class="panel">
      <div class="panel-head"><h2>待回复会话</h2><button id="refresh" class="secondary">刷新</button></div>
      <div id="list"><div class="empty">正在读取未读消息……</div></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>回复编辑</h2></div>
      <label for="conversationId">会话 ID</label>
      <input id="conversationId" inputmode="numeric" autocomplete="off" placeholder="从左侧选择，或手动输入" />
      <label for="operatorNote">客服补充说明（可选）</label>
      <textarea id="operatorNote" maxlength="1000" placeholder="例如：平台故障导致自动取消；本次赠送优惠券。没有补充可留空。"></textarea>
      <label for="message">越南语回复草稿</label>
      <textarea id="message" maxlength="2000" placeholder="选择会话后点击“生成草稿”"></textarea>
      <div class="actions"><button id="generate" class="secondary">生成草稿</button><button id="send" class="primary">确认并发送</button></div>
      <p id="status">请选择左侧的待回复会话。</p>
    </section>
  </div>
</main>
<script>
const $=s=>document.querySelector(s),list=$("#list"),idInput=$("#conversationId"),note=$("#operatorNote"),message=$("#message"),status=$("#status"),refresh=$("#refresh"),generate=$("#generate"),send=$("#send");
function setStatus(t,type=""){status.textContent=t;status.className=type}
function contentText(raw){try{const x=JSON.parse(raw||"");return x.content||raw||""}catch{return raw||""}}
function buyerName(c){return c.participants?.find(p=>p.role==="BUYER")?.nickname||"买家"}
function validId(){const id=idInput.value.trim();if(!/^\d+$/.test(id)){setStatus("请选择会话或输入正确的数字会话 ID。","error");return null}return id}
async function loadChats(){refresh.disabled=true;list.innerHTML='<div class="empty">正在读取未读消息……</div>';try{const r=await fetch("/api/tiktok/conversations",{cache:"no-store"});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||"读取失败");const all=j.data?.conversations||[];const chats=all.filter(c=>Number(c.unread_count||0)>0);if(!chats.length){list.innerHTML='<div class="empty">目前没有未读会话。</div>';return}list.innerHTML="";for(const c of chats){const b=document.createElement("button");b.className="chat";b.type="button";b.dataset.id=c.id;b.innerHTML=`<span class="chat-top"><span class="name"></span><span class="badge"></span></span><span class="preview"></span>`;b.querySelector(".name").textContent=buyerName(c);b.querySelector(".badge").textContent=c.unread_count;b.querySelector(".preview").textContent=contentText(c.latest_message?.content)||"有新的未读消息";b.onclick=()=>{document.querySelectorAll(".chat").forEach(x=>x.classList.remove("active"));b.classList.add("active");idInput.value=String(c.id);message.value="";setStatus(`已选择 ${buyerName(c)}，请点击“生成草稿”。`)};list.appendChild(b)}}catch(e){list.innerHTML=`<div class="empty">${e.message||"无法读取会话"}</div>`}finally{refresh.disabled=false}}
async function generateDraft(){const id=validId();if(!id)return;generate.disabled=send.disabled=true;setStatus("正在读取消息并生成草稿……");try{const p=new URLSearchParams({conversation_id:id});if(note.value.trim())p.set("operator_note",note.value.trim());const r=await fetch(`/api/tiktok/generate-reply?${p}`,{cache:"no-store"});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||"生成失败");if(!j.needs_reply){message.value="";setStatus("该会话目前不需要回复。","success");return}message.value=j.draft||"";setStatus(`草稿已生成（${j.model||j.model_used||"AI"}）。请检查后再发送。`,"success")}catch(e){setStatus(e.message||"生成草稿失败。","error")}finally{generate.disabled=send.disabled=false}}
async function sendReply(){const id=validId(),text=message.value.trim();if(!id)return;if(!text){setStatus("回复内容不能为空。","error");return}if(!confirm(`确认把以下内容发送给买家？\n\n${text}`))return;generate.disabled=send.disabled=true;setStatus("正在发送……");try{const r=await fetch("/api/tiktok/send-reply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conversation_id:id,message:text,confirm:true})});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||"发送失败");setStatus("回复已成功发送给买家。","success");await loadChats()}catch(e){setStatus(e.message||"发送失败。","error")}finally{generate.disabled=send.disabled=false}}
refresh.onclick=loadChats;generate.onclick=generateDraft;send.onclick=sendReply;loadChats();
</script>
</body>
</html>
